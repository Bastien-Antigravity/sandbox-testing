# Feature: Config Server Concurrent Stress
# Spec: sandbox-testing/01-Specifications/FEAT-017-config-concurrent-stress.yaml
# Implementation: 02-Scenarios/go/config_stress_test.go

name: "Config Server Concurrent Stress"
description: "Verifies that the server handles 50+ simultaneous updates to the same key without panicking or corrupting state."
version: "1.0.0"

steps:
  - action: "start_service"
    service: "log-server"
    args: ["cargo", "run"]
    description: "Dependencies."

  - action: "wait"
    duration: 5
    description: "Ready."

  - action: "start_service"
    service: "config-server"
    args: ["./bin/config-server"]
    description: "Target server."

  - action: "wait"
    duration: 5
    description: "Ready."

  - step: "02-Scenarios/go/config_stress_test.go::TestConfigConcurrentStress"
    description: "Execute the high-concurrency collision logic."
