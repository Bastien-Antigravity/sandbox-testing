# Feature: Flexible Logger Resilience, Throttled Drop Alerts & Canonical SSoT Schemas
# Spec: [[02-Business-BDD/02-Behavior-Specs/flexible-logger/FEAT-023-Resilience-Alerts-SSoT]]
