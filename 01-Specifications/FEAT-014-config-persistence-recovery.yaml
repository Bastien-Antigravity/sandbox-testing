# Feature: Config Server Persistence Recovery
# Spec: sandbox-testing/01-Specifications/FEAT-014-config-persistence-recovery.yaml
# Implementation: 02-Scenarios/go/config_persistence_test.go

name: "Config Server Persistence Recovery (Cold Boot)"
description: "Verifies that configuration data survives a server restart (Cold Boot) by loading from the persistent JSON store."
version: "1.0.0"

steps:
  - action: "start_service"
    service: "log-server"
    args: ["cargo", "run"]
    description: "Launch the Rust-based logging engine."

  - action: "wait"
    duration: 15
    description: "Allow time for services to bind (pre-compiled)."

  - action: "start_service"
    service: "config-server"
    args: ["./bin/config-server", "--store", "config_persistence_test.json"]
    description: "Launch the central configuration distributor (Binary mode)."

  - action: "wait"
    duration: 10
    description: "Awaiting service discovery synchronization."

  - step: "02-Scenarios/go/config_persistence_test.go::TestConfigServerPersistenceRecovery"
    description: "Execute the persistence recovery validation logic."
