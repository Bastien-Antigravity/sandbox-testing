# Feature: Config Server Adversarial Hardening
# Spec: sandbox-testing/01-Specifications/FEAT-015-config-adversarial-hardening.yaml
# Implementation: 02-Scenarios/go/config_adversarial_test.go

name: "Config Server Adversarial Hardening"
description: "Verifies that Config Server handles malformed packets and oversized frames without crashing or leaking resources."
version: "1.0.0"

steps:
  - action: "start_service"
    service: "log-server"
    args: ["cargo", "run"]
    description: "Launch dependencies."

  - action: "wait"
    duration: 5
    description: "Binding..."

  - action: "start_service"
    service: "config-server"
    args: ["./bin/config-server"]
    description: "Launch the target server in binary mode."

  - action: "wait"
    duration: 5
    description: "Ready."

  - step: "02-Scenarios/go/config_adversarial_test.go::TestConfigServerAdversarialHardening"
    description: "Run toxic client simulations."
