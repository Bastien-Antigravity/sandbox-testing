common:
    name: common
    common_file_path: ""
    public_key: ""
    reset: false
capabilities:
    config_server:
        ip: ${CF_IP:127.0.0.2}
        port: ${CF_PORT:3306}
        refresh: "300"
    file_system:
        data_path: ./fs_data
        temp_path: ./fs_temp
    log_server:
        ip: ${LS_IP:127.0.0.2}
        port: ${LS_PORT:9020}
    notif_server:
        ip: ${NT_IP:127.0.0.2}
        port: ${NT_PORT:1026}
    scheduler:
        ip: 127.0.0.2
        port: "5001"
    tele_remote:
        chat_id: ${TR_CHATID}
        ip: ${TR_IP:127.0.0.2}
        port: ${TR_PORT:1863}
        token: ${TR_TOKEN}
    rag_engine:
        db_name: ${RAG_DBNAME:obsidiandb}
        user: ${RAG_DBUSER:dbuser}
        password: ${RAG_DBPASSWORD}
        ip: ${RG_IP:127.0.0.2}
        port: ${RG_PORT:8080}
        grpc_ip: ${RG_GRPC_IP:127.0.0.2}
        grpc_port: ${RG_GRPC_PORT:8091}
        rest_port: ${RG_REST_PORT:8093}
    timescale_db:
        db_name: ${TS_DBNAME:maindb}
        ip: ${TS_IP:127.0.0.2}
        password: ${TS_PASSWORD}
        port: ${TS_PORT:5432}
        ssl_cert: "false"
        user: ${TS_USER}
    web_interface:
        ip: ${WB_IP:127.0.0.2}
        port: ${WB_PORT:5000}
